<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Undesirables</title>
<meta name="description" content="Comics and comedy specials from The Undesirables.">
<style>
  :root{--bg:#18181f;--panel:#1e1e2a;--panel2:#242430;--border:rgba(255,255,255,0.08);--text:#e8e2d5;--text2:#8a8478;--text3:#55524a;--accent:#c8956c;--red:#c46a6a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  header{position:sticky;top:0;z-index:5;background:rgba(24,24,31,0.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:14px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:19px;margin:0;letter-spacing:0.01em;font-weight:800}
  header h1 span{color:var(--accent)}
  .tabs{display:flex;gap:6px;margin-left:auto}
  .tab{background:transparent;border:1px solid var(--border);color:var(--text2);border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer;font-weight:600}
  .tab.on{background:var(--accent);color:#1a1410;border-color:var(--accent)}
  main{max-width:1080px;margin:0 auto;padding:22px 16px 80px}
  .empty{text-align:center;color:var(--text2);padding:80px 20px;font-size:15px;line-height:1.7}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s;display:flex;flex-direction:column}
  .card:hover{transform:translateY(-2px);border-color:var(--accent)}
  .card .thumb{aspect-ratio:16/9;background:var(--panel2);position:relative;overflow:hidden}
  .card .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .card .badge{position:absolute;top:8px;left:8px;background:rgba(10,10,14,0.78);color:var(--accent);font-size:10px;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;padding:4px 8px;border-radius:999px}
  .card .meta{padding:11px 13px 13px}
  .card .title{font-size:14.5px;font-weight:700;line-height:1.3;margin:0 0 4px;color:var(--text)}
  .card .date{font-size:11.5px;color:var(--text2);margin:0}
  #detail{display:none}
  #detail.on{display:block}
  #gallery.off{display:none}
  .back{background:none;border:none;color:var(--text2);font-size:13.5px;cursor:pointer;padding:8px 0;margin-bottom:10px;display:flex;align-items:center;gap:6px}
  .back:hover{color:var(--text)}
  #detail h2{font-size:22px;margin:4px 0 2px}
  #detail .d-date{color:var(--text2);font-size:13px;margin:0 0 20px}
  video{width:100%;border-radius:12px;background:#000;display:block;margin-bottom:22px;border:1px solid var(--border)}
  .panels{display:flex;flex-direction:column;gap:14px}
  .panels img{width:100%;border-radius:10px;border:1px solid var(--border);display:block}
  footer{text-align:center;color:var(--text3);font-size:12px;padding:30px 16px 50px}
</style>
</head>
<body>
<header>
  <h1>The <span>Undesirables</span></h1>
  <div class="tabs" id="tabs">
    <button class="tab on" data-f="all">All</button>
    <button class="tab" data-f="studio">Comics</button>
    <button class="tab" data-f="special">Specials</button>
  </div>
</header>
<main>
  <div id="gallery"><div class="grid" id="grid"></div></div>
  <div id="detail">
    <button class="back" id="backBtn">← Back</button>
    <h2 id="d-title"></h2>
    <p class="d-date" id="d-date"></p>
    <video id="d-video" controls playsinline style="display:none"></video>
    <div class="panels" id="d-panels"></div>
  </div>
</main>
<footer>The Undesirables</footer>
<script>
var EPISODES = [];
var FILTER = 'all';

function fmtDate(ts){
  try{ return new Date(ts).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}); }
  catch(e){ return ''; }
}

function render(){
  var grid = document.getElementById('grid');
  var list = EPISODES.filter(function(e){ return FILTER==='all' || e.kind===FILTER; });
  grid.innerHTML = '';
  if(!list.length){
    grid.innerHTML = '';
    var empty = document.createElement('div');
    empty.className = 'empty';
    empty.style.gridColumn = '1/-1';
    empty.textContent = EPISODES.length ? 'Nothing here yet.' : 'Nothing published yet. Check back soon.';
    grid.appendChild(empty);
    return;
  }
  list.forEach(function(ep){
    var card = document.createElement('div');
    card.className = 'card';
    card.onclick = function(){ openDetail(ep); };
    var thumb = document.createElement('div');
    thumb.className = 'thumb';
    var badge = document.createElement('span');
    badge.className = 'badge';
    badge.textContent = ep.kind === 'special' ? 'Special' : 'Comic';
    thumb.appendChild(badge);
    if(ep.panels && ep.panels.length){
      var img = document.createElement('img');
      img.loading = 'lazy';
      img.src = ep.panels[0];
      img.alt = ep.title;
      thumb.appendChild(img);
    }
    card.appendChild(thumb);
    var meta = document.createElement('div');
    meta.className = 'meta';
    var title = document.createElement('p');
    title.className = 'title';
    title.textContent = ep.title || 'Untitled';
    meta.appendChild(title);
    var date = document.createElement('p');
    date.className = 'date';
    date.textContent = fmtDate(ep.ts);
    meta.appendChild(date);
    card.appendChild(meta);
    grid.appendChild(card);
  });
}

function openDetail(ep){
  document.getElementById('gallery').classList.add('off');
  var d = document.getElementById('detail');
  d.classList.add('on');
  document.getElementById('d-title').textContent = ep.title || 'Untitled';
  document.getElementById('d-date').textContent = fmtDate(ep.ts) + (ep.kind==='special' ? ' · Comedy special' : ' · Comic');
  var video = document.getElementById('d-video');
  if(ep.video){
    video.src = ep.video;
    video.style.display = 'block';
  }else{
    video.removeAttribute('src');
    video.style.display = 'none';
  }
  var panelsEl = document.getElementById('d-panels');
  panelsEl.innerHTML = '';
  (ep.panels||[]).forEach(function(p){
    var img = document.createElement('img');
    img.loading = 'lazy';
    img.src = p;
    panelsEl.appendChild(img);
  });
  window.scrollTo(0,0);
}

function closeDetail(){
  document.getElementById('detail').classList.remove('on');
  document.getElementById('gallery').classList.remove('off');
  var video = document.getElementById('d-video');
  video.pause();
  video.removeAttribute('src');
  video.load();
}

document.getElementById('backBtn').onclick = closeDetail;
document.getElementById('tabs').addEventListener('click', function(e){
  var btn = e.target.closest('.tab');
  if(!btn) return;
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(b){ b.classList.remove('on'); });
  btn.classList.add('on');
  FILTER = btn.dataset.f;
  render();
});

fetch('index.json', {cache:'no-store'})
  .then(function(r){ if(!r.ok) throw new Error('no index yet'); return r.json(); })
  .then(function(data){
    EPISODES = (data.episodes || []).slice().sort(function(a,b){ return (b.ts||0) - (a.ts||0); });
    render();
  })
  .catch(function(){
    EPISODES = [];
    render();
  });
</script>
</body>
</html>
